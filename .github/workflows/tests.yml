name: Regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install calculation test dependencies
        run: python -m pip install numpy pandas python-dotenv==1.0.0
      - name: Git credential and publish-state regressions
        run: python -m unittest test_run_git_auth test_run_publish_state
      - name: Importer and generator regressions
        run: python -m unittest discover -s web -p 'test_*.py'
      - name: Report runner regressions
        run: python -m unittest discover -s Bitcoin -p 'test_*.py'
      - name: Price model regressions
        run: python -m unittest discover -s Bitcoin/model_price_prediction -p 'test_*.py'
      - name: Browser logic regressions
        working-directory: web
        run: node --test tests/*.test.cjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser test dependencies
        working-directory: web
        run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Install system dependencies for cached Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium
      - name: Browser regressions
        working-directory: web
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee "$RUNNER_TEMP/browser-tests.log"
      - name: Upload browser failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures
          path: ${{ runner.temp }}/browser-tests.log
          if-no-files-found: ignore
          retention-days: 7
