name: Regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install calculation test dependencies
        run: python -m pip install numpy pandas python-dotenv==1.0.0
      - name: Git credential hygiene regressions
        run: python -m unittest test_run_git_auth
      - name: Publish fingerprint and retry regressions
        run: python -m unittest test_publish_pipeline
      - name: Importer and generator regressions
        run: python -m unittest discover -s web -p 'test_*.py'
      - name: Report runner regressions
        run: python -m unittest discover -s Bitcoin -p 'test_*.py'
      - name: Price model regressions
        run: python -m unittest discover -s Bitcoin/model_price_prediction -p 'test_*.py'
      - name: Browser logic regressions
        working-directory: web
        run: node --test tests/*.test.cjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser test dependencies
        working-directory: web
        run: npm ci
      - name: Resolve Playwright version
        id: playwright
        working-directory: web
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright Chromium and system dependencies
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser suite
        working-directory: web
        run: npm run test:browser
      # The suites are plain Node scripts and write no artifacts by default;
      # this uploads screenshots/traces if a check is extended to emit them.
      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-artifacts
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
